name: Build Epitaph
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.0 }
      - name: Build
        run: |
          echo "Files in repo:"; find . -maxdepth 3 -not -path './.git*' | head -60
          S=$(find . -name settings.gradle -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$S" ]; then echo "NO settings.gradle FOUND - project files were not uploaded"; exit 1; fi
          D=$(dirname "$S"); echo "Building in $D"
          cd "$D" && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: epitaph-jar
          path: "**/build/libs/epitaph-1.0-SNAPSHOT.jar"
